<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Voting App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 50px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 30px; }
        .options { display: flex; justify-content: space-around; margin: 40px 0; }
        .option { padding: 20px 40px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; transition: all 0.3s; }
        .cats { background: #ff6b6b; color: white; }
        .dogs { background: #4ecdc4; color: white; }
        .option:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .info { margin-top: 30px; color: #666; font-size: 14px; }
        .voted { background: #2ecc71; color: white; padding: 10px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗳️ Voting App</h1>
        <p>Which do you prefer?</p>
        
        {% if vote %}
        <div class="voted">Thank you for voting for {{ vote }}!</div>
        {% endif %}
        
        <form method="post">
            <div class="options">
                <button name="vote" class="option cats" value="{{ option_a }}">🐱 {{ option_a }}</button>
                <button name="vote" class="option dogs" value="{{ option_b }}">🐶 {{ option_b }}</button>
            </div>
        </form>
        
        <div class="info">
            <p>Processed by container: {{ hostname }}</p>
        </div>
    </div>
</body>
</html>
