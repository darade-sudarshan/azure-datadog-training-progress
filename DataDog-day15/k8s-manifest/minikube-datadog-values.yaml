datadog:
  site: datadoghq.com

  logs:
    enabled: true
    containerCollectAll: true

  apm:
    enabled: true
    portEnabled: true

clusterAgent:
  enabled: true

agents:
  image:
    tag: "7.70.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
